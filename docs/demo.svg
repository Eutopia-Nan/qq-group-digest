<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <style>
    .mono { font-family: Consolas, "Cascadia Mono", Menlo, "Microsoft YaHei", "PingFang SC", monospace; font-size: 14px; }
    .sans { font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; }
  </style>
  <!-- terminal -->
  <rect x="10" y="10" width="430" height="540" rx="10" fill="#1e1e1e"/>
  <rect x="10" y="10" width="430" height="34" rx="10" fill="#323233"/>
  <rect x="10" y="34" width="430" height="10" fill="#323233"/>
  <circle cx="32" cy="27" r="6" fill="#ff5f57"/><circle cx="52" cy="27" r="6" fill="#febc2e"/><circle cx="72" cy="27" r="6" fill="#28c840"/>
  <text x="225" y="32" text-anchor="middle" class="sans" font-size="13" fill="#cccccc">cmd</text>
  <g class="mono" fill="#d4d4d4" xml:space="preserve">
    <text x="26" y="76"><tspan fill="#4ec9b0">&gt;</tspan> python digest.py --preset daily</text>
    <text x="26" y="106" fill="#9cdcfe">预设 daily：最近 24 小时</text>
    <text x="26" y="130">[学习群] 使用 群_123456789_学习群.csv</text>
    <text x="26" y="154">[技术群] 使用 群_987654321_技术群.csv</text>
