    <text x="500" y="340" font-size="17" font-weight="700">技术群</text>
    <text x="500" y="370" font-size="15" font-weight="700">赚钱机会</text>
    <text x="500" y="396" font-size="14"><tspan fill="#d4a017">★★★★★</tspan> 开源项目文档翻译招募</text>
    <text x="512" y="418" font-size="12" fill="#57606a">• 按字数计酬，截止 11-25</text>
    <text x="512" y="438" font-size="12" fill="#1a7f37">• 我能参加吗：可以，面向在校学生</text>
    <text x="500" y="470" font-size="15" font-weight="700">术语小词典</text>
    <text x="512" y="494" font-size="12" fill="#57606a">• token：AI 处理文字的计费单位……</text>
    <text x="512" y="514" font-size="12" fill="#57606a">• infra：服务器、芯片等底层技术……</text>
