    <text x="512" y="170" font-size="12" fill="#57606a">• 具体时间以本班老师通知为准</text>
    <text x="512" y="190" font-size="12" fill="#57606a">• 📅 2026-11-17 19:20</text>
    <text x="500" y="222" font-size="15" font-weight="700">学习资料</text>
    <text x="500" y="248" font-size="14"><tspan fill="#d4a017">★★★★</tspan> 往年真题合集整理</text>
    <text x="512" y="270" font-size="12" fill="#57606a">• 解释：真题就是往年考过的卷子……</text>
    <text x="512" y="290" font-size="12" fill="#0969da">• 链接：https://...</text>
