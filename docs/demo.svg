    <text x="26" y="258">[技术群] 79 条消息，</text>
    <text x="26" y="278">  去掉图片/空消息后 59 条</text>
    <text x="26" y="302" fill="#808080">  AI 分析中 (1/1)，1769 字...</text>
    <text x="26" y="342" fill="#6a9955">完成 → reports/今日快报/</text>
    <text x="26" y="362" fill="#6a9955">       今日快报_2026-11-17_2229.md</text>
    <text x="26" y="402" fill="#808080">551 条消息 → 9 条有用信息</text>
    <text x="26" y="426" fill="#808080">本次花费约 ¥0.02</text>
  </g>
  <!-- arrow -->
  <path d="M448 280 L468 280" stroke="#888" stroke-width="2"/>
  <path d="M466 274 L474 280 L466 286 Z" fill="#888"/>
  <!-- report -->
  <rect x="480" y="10" width="410" height="540" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <g class="sans" fill="#1f2328">
    <text x="500" y="50" font-size="22" font-weight="700">今日快报 2026-11-17</text>
    <line x1="500" y1="62" x2="870" y2="62" stroke="#d0d7de"/>
    <text x="500" y="92" font-size="17" font-weight="700">学习群</text>
    <text x="500" y="122" font-size="15" font-weight="700">考试与作业通知</text>
